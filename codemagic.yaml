# Hotspot Fishing — Codemagic iOS/TestFlight workflow
# Fresh workflow id to force Codemagic to discard stale configuration
# Trigger refresh 2026-09-05: force Codemagic to reload v6 from main
workflows:
  ios-testflight-v6:
    name: iOS TestFlight v6
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic_asc_api_key

    environment:
      vars:
        APP_STORE_APPLE_ID: "6771454287"
        BUNDLE_ID: "app.lovable.hotspotfishing"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        CI: "true"
      node: 22
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install dependencies v6 — npm install (NO npm ci)
        script: |
          set -euxo pipefail
          echo "WORKFLOW V6 — using npm install, not npm ci"
          echo "Using Node $(node --version) / npm $(npm --version)"
          rm -rf node_modules
          rm -f package-lock.json npm-shrinkwrap.json
          npm cache clean --force
          npm config set package-lock false
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        script: |
          set -euxo pipefail
          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -euxo pipefail
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Set up code signing
        script: |
          set -euxo pipefail
          keychain initialize
          openssl genrsa -out "$CM_BUILD_DIR/ios_distribution_private_key.pem" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CM_BUILD_DIR/ios_distribution_private_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -euxo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
