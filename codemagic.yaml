# Hotspot Fishing — Codemagic iOS/TestFlight
# Firma manual: evita la integración App Store Connect de Codemagic que devuelve 401.
workflows:
  ios-testflight-pnpm:
    name: HOTSPOT iOS TestFlight — manual signing
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore_credentials
      vars:
        IOS_BUNDLE_ID: "app.lovable.hotspotfishing"
        CI: "true"
      node: 22
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.bundle

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Validate manual signing credentials
        script: |
          set -euo pipefail
          missing=""
          for key in APPLE_TEAM_ID IOS_BUNDLE_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            eval "value=\${$key:-}"
            if [ -z "$value" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing Codemagic variables:$missing"
            exit 1
          fi
          echo "Manual signing credentials are present."

      - name: Install dependencies and prepare iOS
        script: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec cap sync ios
          cd ios/App
          pod install --repo-update
          cd ../..
          bundle install

      - name: Build and upload to TestFlight with Fastlane
        script: |
          set -euxo pipefail
          export KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          export BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_ID:0:8}}"
          export IOS_PROJECT_PREPARED="true"
          bundle exec fastlane ios beta

    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
