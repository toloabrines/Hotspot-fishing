# Hotspot Fishing — Codemagic iOS
#
# Los dos flujos son manuales. Ninguno publica en App Store Connect.
# 1) ios-validate comprueba que la app compila sin firma ni credenciales de Apple.
# 2) ios-testflight crea una IPA firmada y la deja como artefacto para revisión.
#
# La subida a TestFlight se añadirá únicamente después de validar la IPA.

workflows:
  ios-validate:
    name: iOS — Validar compilación (sin firma)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        IOS_BUNDLE_ID: "app.lovable.hotspotfishing"
        CI: "true"
      node: 22
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/pnpm

    scripts:
      - name: Comprobar identificador de la app
        script: |
          set -euo pipefail
          ACTUAL_BUNDLE_ID="$(sed -n "s/.*appId: ['\"]\([^'\"]*\)['\"].*/\1/p" capacitor.config.ts | head -1)"
          if [ "$ACTUAL_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]; then
            echo "Bundle ID incorrecto: '$ACTUAL_BUNDLE_ID' (esperado: '$IOS_BUNDLE_ID')"
            exit 1
          fi

      - name: Instalar dependencias y preparar iOS
        script: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Compilar para simulador
        script: |
          set -euxo pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-testflight:
    name: iOS — Crear IPA firmada (sin subir)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.hotspotfishing
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        CI: "true"
      node: 22
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/pnpm

    scripts:
      - name: Instalar dependencias y preparar iOS
        script: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Aplicar certificado y perfil de App Store
        script: |
          set -euxo pipefail
          xcode-project use-profiles

      - name: Crear IPA firmada
        script: |
          set -euxo pipefail
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
