# Hotspot Fishing — Codemagic iOS
#
# Todos los flujos son manuales. Ninguno publica en App Store Connect.
# 1) ios-validate comprueba que la app compila sin firma ni credenciales de Apple.
# 2) ios-testflight crea una IPA firmada y la deja como artefacto para revisión.
# 3) ios-signing-info consulta los identificadores de firma.
# 4) ios-create-profile crea el perfil App Store vinculado al certificado nuevo.
#
# La subida a TestFlight se activará únicamente con autorización expresa.

workflows:
  ios-validate:
    name: iOS — Validar compilación (sin firma)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        IOS_BUNDLE_ID: "app.lovable.hotspotfishing"
        CI: "true"
      node: 22
      xcode: 26.4
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/pnpm

    scripts:
      - name: Comprobar identificador de la app
        script: |
          set -euo pipefail
          ACTUAL_BUNDLE_ID="$(sed -n "s/.*appId: ['\"]\([^'\"]*\)['\"].*/\1/p" capacitor.config.ts | head -1)"
          if [ "$ACTUAL_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]; then
            echo "Bundle ID incorrecto: '$ACTUAL_BUNDLE_ID' (esperado: '$IOS_BUNDLE_ID')"
            exit 1
          fi

      - name: Instalar dependencias y preparar iOS
        script: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Compilar para simulador
        script: |
          set -euxo pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-testflight:
    name: iOS — Crear IPA firmada (sin subir)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "app.lovable.hotspotfishing"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        CI: "true"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.hotspotfishing
      node: 22
      xcode: 26.4
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/pnpm

    scripts:
      - name: Preparar icono obligatorio de iOS sin transparencia
        script: |
          set -euxo pipefail
          ICON_SOURCE="android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          ICON_TMP_JPG="/tmp/hotspot-app-icon.jpg"
          test -f "$ICON_SOURCE"
          sips -s format jpeg -s formatOptions 100 -z 1024 1024 "$ICON_SOURCE" --out "$ICON_TMP_JPG"
          sips -s format png "$ICON_TMP_JPG" --out "$ICON_DEST"
          test -s "$ICON_DEST"
          if sips -g hasAlpha "$ICON_DEST" | grep -q "hasAlpha: yes"; then
            echo "El icono iOS todavía contiene transparencia"
            exit 1
          fi

      - name: Instalar dependencias y preparar iOS
        script: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Inicializar el llavero de firma
        script: |
          set -euxo pipefail
          keychain initialize

      - name: Añadir el certificado al llavero
        script: |
          set -euxo pipefail
          keychain add-certificates

      - name: Aplicar certificado y perfil de App Store
        script: |
          set -euxo pipefail
          xcode-project use-profiles

      - name: Crear IPA firmada
        script: |
          set -euxo pipefail
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-signing-info:
    name: iOS — Comprobar firma de Apple
    max_build_duration: 15
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "app.lovable.hotspotfishing"
      xcode: 26.4

    integrations:
      app_store_connect: codemagic_hotspot_2026

    scripts:
      - name: Consultar Bundle ID y certificados
        script: |
          set -euxo pipefail
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json
          app-store-connect certificates list \
            --profile-type IOS_APP_STORE \
            --json

  ios-create-profile:
    name: iOS — Crear perfil App Store
    max_build_duration: 15
    instance_type: mac_mini_m2

    environment:
      xcode: 26.4

    integrations:
      app_store_connect: codemagic_hotspot_2026

    scripts:
      - name: Crear perfil vinculado al certificado nuevo
        script: |
          set -euxo pipefail
          app-store-connect profiles create "42Z9XZ5SAA" \
            --certificate-ids "54Z3LB277Y" \
            --type IOS_APP_STORE \
            --name "Hotspot Fishing App Store 2026 v2" \
            --save


  ios-appstore-complete-metadata:
    name: iOS — Completar metadatos de App Store
    max_build_duration: 10
    instance_type: mac_mini_m2

    environment:
      xcode: 26.4

    integrations:
      app_store_connect: codemagic_hotspot_2026

    scripts:
      - name: Completar ficha inglesa, privacidad y categoría
        script: |
          set -euo pipefail
          CODEMAGIC_PYTHON="$(head -n 1 "$(command -v app-store-connect)")"
          CODEMAGIC_PYTHON="${CODEMAGIC_PYTHON#\#!}"
          "$CODEMAGIC_PYTHON" <<'PY'
          import json
          import os
          from codemagic.apple.app_store_connect.api_client import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types

          client = AppStoreConnectApiClient(
              key_identifier=Types.KeyIdentifierArgument(os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]).value,
              issuer_id=Types.IssuerIdArgument(os.environ["APP_STORE_CONNECT_ISSUER_ID"]).value,
              private_key=Types.PrivateKeyArgument(os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]).value,
          )
          def request(method, path, payload=None):
              response = client.session.request(method, f"{client.API_URL}{path}", json=payload)
              if not response.ok:
                  raise RuntimeError(f"{method} {path}: {response.status_code} {response.text}")
              if response.status_code == 204:
                  return None
              return response.json()

          en_version_loc = "67da2d12-e65e-405b-9ad1-e19434a1a156"
          en_info_loc = "bf45d92e-bb36-4b93-aee8-6112ce7cb914"
          es_info_loc = "1d2ec3b1-a8e3-48bb-86b3-b87cebfae80d"
          app_info_id = "c7f7a308-5f67-481c-90de-bc302719cd5e"
          privacy_url = "https://hotspotfishing.app/privacy"

          english_description = """Hotspot Fishing is an advanced tool for sport anglers that combines real-time oceanographic data to help identify areas with strong fishing potential.

          Features:

          • Sea surface temperature (SST)
          • Chlorophyll
          • Ocean currents
          • Bathymetry and underwater terrain
          • Automatic hotspot identification
          • Fishing activity analysis
          • High-resolution interactive maps
          • Precise coordinates for navigation

          Designed for trolling, bottom fishing, jigging and sport fishing in general.

          Spend less time searching. Spend more time fishing."""
          english_description = "\n".join(line.strip() for line in english_description.splitlines())

          request("PATCH", f"/appStoreVersionLocalizations/{en_version_loc}", {
              "data": {
                  "type": "appStoreVersionLocalizations",
                  "id": en_version_loc,
                  "attributes": {
                      "description": english_description,
                      "keywords": "fishing,bathymetry,chlorophyll,temperature,currents,hotspots,ocean,maps,navigation",
                      "marketingUrl": "https://totymar.com/",
                      "promotionalText": "Find promising fishing hotspots with sea temperature, chlorophyll, current and bathymetry maps.",
                      "supportUrl": "https://hotspot-fishing.lovable.app/support"
                  }
              }
          })
          request("PATCH", f"/appInfoLocalizations/{en_info_loc}", {
              "data": {
                  "type": "appInfoLocalizations",
                  "id": en_info_loc,
                  "attributes": {"privacyPolicyUrl": privacy_url}
              }
          })
          request("PATCH", f"/appInfoLocalizations/{es_info_loc}", {
              "data": {
                  "type": "appInfoLocalizations",
                  "id": es_info_loc,
                  "attributes": {
                      "subtitle": "Mapas y hotspots de pesca",
                      "privacyPolicyUrl": privacy_url
                  }
              }
          })
          request("PATCH", f"/appInfos/{app_info_id}/relationships/primaryCategory", {
              "data": {"type": "appCategories", "id": "SPORTS"}
          })

          en = request("GET", f"/appStoreVersionLocalizations/{en_version_loc}")["data"]["attributes"]
          en_info = request("GET", f"/appInfoLocalizations/{en_info_loc}")["data"]["attributes"]
          es_info = request("GET", f"/appInfoLocalizations/{es_info_loc}")["data"]["attributes"]
          category = request("GET", f"/appInfos/{app_info_id}/primaryCategory").get("data")
          verified = bool(
              en.get("description") and en.get("keywords") and en.get("supportUrl")
              and en_info.get("privacyPolicyUrl") and es_info.get("privacyPolicyUrl")
              and category and category.get("id") == "SPORTS"
          )
          print("APP_STORE_METADATA_COMPLETED=" + json.dumps({
              "verified": verified,
              "englishVersionMetadata": bool(en.get("description") and en.get("keywords") and en.get("supportUrl")),
              "privacyPolicyPresent": bool(en_info.get("privacyPolicyUrl") and es_info.get("privacyPolicyUrl")),
              "spanishSubtitlePresent": bool(es_info.get("subtitle")),
              "primaryCategory": category.get("id") if category else None
          }))
          if not verified:
              raise RuntimeError("La verificación de metadatos no ha sido satisfactoria")
          PY

  ios-testflight-status:
    name: iOS — Comprobar estado en TestFlight
    max_build_duration: 10
    instance_type: mac_mini_m2

    environment:
      xcode: 26.4

    integrations:
      app_store_connect: codemagic_hotspot_2026

    scripts:
      - name: Consultar las últimas compilaciones sin modificar nada
        script: |
          set -euo pipefail
          CODEMAGIC_PYTHON="$(head -n 1 "$(command -v app-store-connect)")"
          CODEMAGIC_PYTHON="${CODEMAGIC_PYTHON#\#!}"
          "$CODEMAGIC_PYTHON" <<'PY'
          import json
          import os
          from codemagic.apple.app_store_connect.api_client import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types

          client = AppStoreConnectApiClient(
              key_identifier=Types.KeyIdentifierArgument(os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]).value,
              issuer_id=Types.IssuerIdArgument(os.environ["APP_STORE_CONNECT_ISSUER_ID"]).value,
              private_key=Types.PrivateKeyArgument(os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]).value,
          )

          def get(path, params=None):
              response = client.session.get(f"{client.API_URL}{path}", params=params)
              if not response.ok:
                  raise RuntimeError(f"GET {path}: {response.status_code} {response.text}")
              return response.json()

          apps = get("/apps", {"filter[bundleId]": "app.lovable.hotspotfishing", "limit": "1"}).get("data", [])
          if not apps:
              raise RuntimeError("No se encontró Hotspot Fishing en App Store Connect")

          builds = get("/builds", {
              "filter[app]": apps[0]["id"],
              "sort": "-uploadedDate",
              "limit": "10",
          }).get("data", [])

          result = [{
              "id": build.get("id"),
              "version": build.get("attributes", {}).get("version"),
              "uploadedDate": build.get("attributes", {}).get("uploadedDate"),
              "processingState": build.get("attributes", {}).get("processingState"),
              "expired": build.get("attributes", {}).get("expired"),
          } for build in builds]

          print("TESTFLIGHT_STATUS=" + json.dumps(result, ensure_ascii=False))
          print("TESTFLIGHT_BUILD_FOUND=" + ("true" if builds else "false"))
          PY
