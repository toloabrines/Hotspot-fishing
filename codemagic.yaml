# Hotspot Fishing — Codemagic iOS/TestFlight
workflows:
  ios-testflight-pnpm:
    name: HOTSPOT iOS TestFlight PNPM
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic_asc_api_key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.hotspotfishing
      vars:
        APP_STORE_APPLE_ID: "6771454287"
        BUNDLE_ID: "app.lovable.hotspotfishing"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        CI: "true"
      node: 22
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install JS dependencies (PNPM ONLY)
        script: |
          set -euxo pipefail
          echo "HOTSPOT PNPM WORKFLOW — DO NOT USE NPM CI"
          echo "Node: $(node --version)"
          rm -rf node_modules
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
          pnpm install --no-frozen-lockfile

      - name: Build web assets
        script: |
          set -euxo pipefail
          pnpm run build

      - name: Capacitor sync iOS
        script: |
          set -euxo pipefail
          pnpm exec cap sync ios

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Apply provisioning profile to App project
        script: |
          set -euxo pipefail
          echo "Provisioning profiles available:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build IPA
        script: |
          set -euxo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
