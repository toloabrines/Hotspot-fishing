name: iOS — TestFlight

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "ios-config/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "fastlane/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      lane:
        description: "fastlane lane (beta | release)"
        required: true
        default: "beta"
        type: choice
        options: [beta, release]
  push:
    branches: [main]
    tags: ["ios-v*"]
    paths:
      - "src/**"
      - "ios/**"
      - "ios-config/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - "fastlane/**"
      - ".github/workflows/ios-testflight.yml"

jobs:
  preflight:
    name: Preflight — secretos iOS
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - id: check
        shell: bash
        run: |
          missing=()
          for key in APPLE_TEAM_ID IOS_BUNDLE_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "✅ Todos los secretos iOS necesarios están presentes"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Faltan estos secretos iOS:"
            printf ' - %s\n' "${missing[@]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-upload:
    name: Build & upload TestFlight
    needs: preflight
    if: github.event_name != 'pull_request' && needs.preflight.outputs.ready == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Crear contraseña temporal de keychain
        shell: bash
        run: |
          echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Instalar dependencias y preparar iOS
        shell: bash
        run: |
          set -e
          npm install --ignore-scripts
          mkdir -p dist
          echo '<html><body>Loading...</body></html>' > dist/index.html
          npx --no-install cap sync ios
          gem install cocoapods --no-document
          cd ios/App
          pod install --repo-update

      - name: Compilar y subir
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          LANE: ${{ github.event.inputs.lane || 'beta' }}
          IOS_PROJECT_PREPARED: "true"
        run: bundle exec fastlane ios "$LANE"

      - name: Subir IPA como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HotspotFishing-ipa
          path: build/*.ipa
          if-no-files-found: ignore

      - name: Mostrar logs si falla
        if: failure()
        shell: bash
        run: |
          set +e
          for log in "$HOME"/Library/Logs/gym/*.log fastlane/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            tail -n 250 "$log"
          done

  missing-secrets:
    name: iOS bloqueado — faltan secretos
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Revisa el job Preflight — secretos iOS; allí aparece la lista exacta de secretos que faltan."
