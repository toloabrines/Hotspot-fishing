name: Validate pnpm lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Validate dependency lock
        run: pnpm install --frozen-lockfile
