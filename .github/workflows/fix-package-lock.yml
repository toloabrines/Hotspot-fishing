name: Fix package-lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-package-lock.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate package-lock cleanly
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already valid"
          else
            git commit -m "fix: regenerate package-lock for clean npm ci"
            git push origin HEAD:main
          fi
