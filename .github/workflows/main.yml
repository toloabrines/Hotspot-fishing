name: Build iOS and upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Construir aplicación web
        run: npm run build

      - name: Crear proyecto iOS si no existe
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: Instalar certificado Apple
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Preparar clave de App Store Connect
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPLE_KEY_ID}.p8"

      - name: Instalar CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Crear archivo de exportación
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>

              <key>uploadSymbols</key>
              <true/>

              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Compilar aplicación iOS
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HotspotFishing.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID" \
            clean archive

      - name: Crear archivo IPA
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HotspotFishing.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hotspot-Fishing-IPA
          path: ${{ runner.temp }}/export/*.ipa

      - name: Subir a TestFlight
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          IPA_FILE=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPLE_KEY_ID" \
            --apiIssuer "$APPLE_ISSUER_ID"
