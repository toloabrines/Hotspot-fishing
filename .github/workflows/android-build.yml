name: Android — Build APK/AAB

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (debug | release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - "android-v*" # ej. android-v1.0.3 dispara un build de release firmado

jobs:
  preflight:
    name: Preflight — detectar secretos Android
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        id: check
        run: |
          set -e
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "• Falta secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "0" ]; then
            echo "✓ Todos los secretos de firma Android presentes"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠ Faltan secretos de firma — sólo se construirá APK debug"
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Android (Gradle)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/android-v') && 'release' || 'debug') }}
      HAS_SIGNING: ${{ needs.preflight.outputs.has_signing }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS deps
        run: npm install --ignore-scripts

      - name: Build web
        run: npm run build

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor sync Android
        run: npx --no-install cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.HAS_SIGNING == 'true' && env.BUILD_TYPE == 'release'
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
          echo "✓ Keystore decodificado"

      - name: Inject release signingConfig
        if: env.HAS_SIGNING == 'true' && env.BUILD_TYPE == 'release'
        run: |
          set -e
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs {" "$GRADLE"; then
            python3 - "$GRADLE" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          signing = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """
          src = re.sub(r"(android\s*\{)", r"\1\n" + signing, src, count=1)
          src = re.sub(
              r"buildTypes\s*\{\s*release\s*\{",
              "buildTypes {\n        release {\n            signingConfig signingConfigs.release",
              src,
              count=1,
          )
          open(path, "w").write(src)
          PY
          fi
          cat android/app/build.gradle

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK + AAB
        if: env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true'
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: HotspotFishing-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release artifacts
        if: env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HotspotFishing-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Aviso si falta firma para release
        if: env.BUILD_TYPE == 'release' && env.HAS_SIGNING != 'true'
        run: |
          echo "⚠ Build release solicitado pero faltan secretos de firma."
          echo "Añade ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD en Settings → Secrets."
          exit 1
